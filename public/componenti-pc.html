<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sistemi PLC - SK GROUP SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); }
    </style>
</head>
<body>

    <!-- Header / Navbar stile Home Page -->
    <header class="flex justify-between items-center px-10 py-6 border-b border-slate-800 glass-card">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white font-bold p-2 rounded-lg">SK</div>
            <span class="font-extrabold tracking-wider text-xl">SK GROUP SYSTEM</span>
        </div>
        <nav class="space-x-6 text-sm text-slate-300">
            <a href="index.html" class="hover:text-blue-400">Home</a>
            <a href="componenti-pc.html" class="hover:text-blue-400">Componenti PC</a>
            <a href="sistemi-plc.html" class="text-blue-500 font-bold">Sistemi PLC</a>
            <a href="login.html" class="hover:text-blue-400">Area Lavoratori</a>
        </nav>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-extrabold mb-8 text-center text-blue-400">Catalogo Annunci Disponibili</h1>
        
        <div id="grid-prodotti" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Gli annunci verranno caricati qui via JavaScript -->
        </div>
    </main>

    <script>
        async function caricaAnnunci() {
            const res = await fetch('/api/prodotti');
            const prodotti = await res.json();
            const container = document.getElementById('grid-prodotti');
            container.innerHTML = '';

            prodotti.forEach(p => {
                const esaurito = p.quantita <= 0;
                container.innerHTML += `
                    <div class="glass-card rounded-2xl p-6 flex flex-col justify-between">
                        <div>
                            <img src="${p.immagine || 'https://via.placeholder.com/300'}" class="w-full h-48 object-cover rounded-xl mb-4">
                            <span class="text-xs text-blue-400 font-bold uppercase">${p.categoria}</span>
                            <h3 class="text-xl font-bold mt-1 mb-2">${p.nome}</h3>
                            <p class="text-slate-400 text-sm mb-4">${p.descrizione || 'Nessuna descrizione.'}</p>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-2xl font-black text-white">€${p.prezzo}</span>
                                <span class="text-sm font-semibold ${esaurito ? 'text-red-500' : 'text-emerald-400'}">
                                    ${esaurito ? 'ESAURITO' : 'Disponibile (' + p.quantita + ')'}
                                </span>
                            </div>
                            <button onclick="acquista(${p.id})" ${esaurito ? 'disabled' : ''} 
                                class="w-full py-3 rounded-xl font-bold ${esaurito ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500 text-white transition'}">
                                ${esaurito ? 'Non Disponibile' : 'Acquista Ora'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        async function acquista(id) {
            const res = await fetch(`/api/prodotti/acquista/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                alert(data.message);
                caricaAnnunci();
            } else {
                alert(data.error);
            }
        }

        caricaAnnunci();
    </script>
</body>
</html>
