<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Gestionale</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700/60 p-8 rounded-2xl shadow-2xl w-full max-w-sm space-y-6">
        <div class="text-center">
            <h1 class="text-xl font-bold text-white tracking-wide">Accesso Gestionale</h1>
        </div>

        <form onsubmit="eseguiLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Username</label>
                <input id="username" type="text" placeholder="admin" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                <input id="password" type="password" placeholder="•••••" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500 transition">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-blue-600/30">
                Accedi
            </button>
        </form>

        <p id="errore-msg" class="hidden text-center text-xs font-semibold text-red-500 mt-2"></p>
    </div>

    <script>
        async function eseguiLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errBox = document.getElementById('errore-msg');

            errBox.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok) {
                    // Salva le credenziali e il token nel localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('ruolo', data.ruolo);
                    
                    // Reindirizza alla dashboard
                    window.location.href = '/dashboard.html';
                } else {
                    errBox.textContent = data.error || 'Credenziali errate.';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.textContent = 'Impossibile connettersi al server';
                errBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
