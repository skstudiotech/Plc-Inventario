<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestione Annunci - SK Group System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f7f6; }
    .card-annuncio { background: #ffffff; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  </style>
</head>
<body class="p-4">
  <script>
    if (!localStorage.getItem('token')) {
      window.location.replace('/login.html');
    }
  </script>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Pannello Controllo Annunci Pubblicati</h2>
      <a href="/dashboard.html" class="btn btn-secondary">← Torna alla Dashboard</a>
    </div>

    <!-- Modulo di modifica/pubblicazione annunci -->
    <div class="card p-4 card-annuncio mb-4">
      <h4 class="mb-3">📢 Modifica o Pubblica Annuncio</h4>
      <form id="formAnnuncio" onsubmit="pubblicaAnnuncio(event)">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Seleziona Prodotto DB</label>
            <select id="selectProdotto" class="form-select" required></select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Categoria Destinazione</label>
            <select id="categoriaShop" class="form-select" required>
              <option value="componenti-pc">Componenti PC & Schede Madri</option>
              <option value="custom-pc">Costruzione Custom PC</option>
              <option value="sistemi-plc">Sistemi PLC & Componenti</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Prezzo (€)</label>
            <input type="number" step="0.01" id="prezzo" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">URL Immagine</label>
            <input type="text" id="urlImmagine" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Breve Descrizione</label>
            <input type="text" id="descrizione" class="form-control">
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Salva / Aggiorna Annuncio</button>
      </form>
    </div>

    <!-- Tabella di Eliminazione/Gestione -->
    <div class="card p-4 card-annuncio">
      <h4>Annunci Attivi</h4>
      <table class="table table-striped mt-3">
        <thead>
          <tr>
            <th>ID</th>
            <th>Titolo</th>
            <th>Categoria</th>
            <th>Prezzo</th>
            <th class="text-end">Azioni</th>
          </tr>
        </thead>
        <tbody id="tabellaAnnunci"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function caricaProdottiPerForm() {
      const res = await fetch('/api/prodotti', {
        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
      });
      const prodotti = await res.json();
      const sel = document.getElementById('selectProdotto');
      sel.innerHTML = '<option value="">-- Seleziona Prodotto --</option>';
      
      const tbody = document.getElementById('tabellaAnnunci');
      tbody.innerHTML = '';

      prodotti.forEach(p => {
        sel.innerHTML += `<option value="${p.id}">${p.nome} (Q.tà: ${p.quantita})</option>`;
        tbody.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td><strong>${p.nome}</strong></td>
            <td><span class="badge bg-info text-dark">${p.categoria}</span></td>
            <td>€${parseFloat(p.prezzo || 0).toFixed(2)}</td>
            <td class="text-end">
              <button onclick="eliminaAnnuncio(${p.id})" class="btn btn-danger btn-sm">Elimina</button>
            </td>
          </tr>
        `;
      });
    }

    async function pubblicaAnnuncio(e) {
      e.preventDefault();
      const prodottoId = document.getElementById('selectProdotto').value;
      const categoria = document.getElementById('categoriaShop').value;
      const prezzo = document.getElementById('prezzo').value;
      const urlImmagine = document.getElementById('urlImmagine').value;
      const descrizione = document.getElementById('descrizione').value;

      const res = await fetch('/api/annunci', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.getItem('token') 
        },
        body: JSON.stringify({ prodottoId, categoria, prezzo, urlImmagine, descrizione })
      });

      if (res.ok) {
        alert('Annuncio pubblicato con successo!');
        caricaProdottiPerForm();
      } else {
        const err = await res.json();
        alert(err.error || 'Errore durante la pubblicazione');
      }
    }

    async function eliminaAnnuncio(id) {
      if (!confirm('Eliminare questo annuncio?')) return;
      const res = await fetch(`/api/prodotti/annuncio/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
      });
      if (res.ok) {
        caricaProdottiPerForm();
      }
    }

    caricaProdottiPerForm();
  </script>
</body>
</html>
