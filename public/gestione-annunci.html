<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Annunci - SK Group System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold">SK</div>
            <h1 class="text-lg font-bold">Pannello Gestione Annunci</h1>
        </div>
        <div class="flex items-center space-x-4">
            <a href="dashboard.html" class="px-4 py-2 text-sm bg-slate-800 hover:bg-slate-700 rounded-lg transition">
                ← Torna alla Dashboard
            </a>
            <button onclick="logout()" class="px-4 py-2 text-sm bg-red-600 hover:bg-red-700 rounded-lg transition">
                Logout
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Form Pubblica Annuncio -->
        <section class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-6 flex items-center">
                <span class="mr-2">📣</span> Pubblica Nuovo Annuncio
            </h2>
            <form id="form-annuncio" onsubmit="pubblicaAnnuncio(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Seleziona Prodotto Padre</label>
                    <select id="prodotto-padre" onchange="autocompilaDaMagazzino()" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="">-- Seleziona un Prodotto dal Magazzino --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Categoria Annuncio</label>
                    <select id="categoria-annuncio" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="componenti-pc">Componenti PC & Schede Madri</option>
                        <option value="custom-pc">Costruzione Custom PC</option>
                        <option value="sistemi-plc">Sistemi PLC & Componenti</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Prezzo (€)</label>
                    <input type="number" step="0.01" id="prezzo-annuncio" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="0.00">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">URL Immagine</label>
                    <input type="text" id="immagine-annuncio" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="https://...">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Descrizione Annuncio</label>
                    <textarea id="descrizione-annuncio" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Inserisci i dettagli dell'annuncio..."></textarea>
                </div>

                <div class="md:col-span-2 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-lg transition shadow-lg shadow-blue-600/30">
                        Pubblica Annuncio
                    </button>
                </div>
            </form>
        </section>

        <!-- Tabella Annunci Attivi -->
        <section class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-6 flex items-center">
                <span class="mr-2">📋</span> Annunci Pubblicati
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-800/60 text-slate-400 text-xs uppercase border-b border-slate-700">
                        <tr>
                            <th class="p-3">Prodotto</th>
                            <th class="p-3">Categoria</th>
                            <th class="p-3">Prezzo</th>
                            <th class="p-3">Giacenza</th>
                            <th class="p-3 text-right">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="lista-annunci" class="divide-y divide-slate-800">
                        <!-- Caricato via JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        const socket = io();
        const token = localStorage.getItem('token');
        const userRuolo = localStorage.getItem('ruolo');

        // Controllo Accesso
        if (!token || (userRuolo !== 'Admin' && userRuolo !== 'Ufficio')) {
            alert('Accesso Negato! Sezione riservata ad Admin e Ufficio.');
            window.location.href = 'dashboard.html';
        }

        async function caricaProdottiPerSelect() {
            try {
                const res = await fetch('/api/prodotti', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const prodotti = await res.json();
                const select = document.getElementById('prodotto-padre');
                
                select.innerHTML = '<option value="">-- Seleziona un Prodotto dal Magazzino --</option>';
                prodotti.forEach(p => {
                    select.innerHTML += `<option value="${p.id}" data-prezzo="${p.prezzo}" data-img="${p.immagine || ''}" data-desc="${p.descrizione || ''}">${p.nome} (Qta: ${p.quantita})</option>`;
                });
            } catch (err) {
                console.error('Errore caricamento prodotti:', err);
            }
        }

        function autocompilaDaMagazzino() {
            const select = document.getElementById('prodotto-padre');
            const selected = select.options[select.selectedIndex];
            if (selected && selected.value) {
                document.getElementById('prezzo-annuncio').value = selected.dataset.prezzo || '';
                document.getElementById('immagine-annuncio').value = selected.dataset.img || '';
                document.getElementById('descrizione-annuncio').value = selected.dataset.desc || '';
            }
        }

        async function caricaAnnunciAttivi() {
            try {
                const res = await fetch('/api/prodotti', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const prodotti = await res.json();
                const tbody = document.getElementById('lista-annunci');
                tbody.innerHTML = '';

                prodotti.forEach(p => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/40">
                            <td class="p-3 font-semibold">${p.nome}</td>
                            <td class="p-3 text-slate-400">${p.categoria}</td>
                            <td class="p-3 text-emerald-400">€ ${p.prezzo.toFixed(2)}</td>
                            <td class="p-3">${p.quantita}</td>
                            <td class="p-3 text-right">
                                <button onclick="eliminaAnnuncio(${p.id})" class="px-3 py-1 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded text-xs transition">
                                    Elimina
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Errore caricamento annunci:', err);
            }
        }

        async function pubblicaAnnuncio(e) {
            e.preventDefault();
            const payload = {
                prodottoId: document.getElementById('prodotto-padre').value,
                categoria: document.getElementById('categoria-annuncio').value,
                prezzo: parseFloat(document.getElementById('prezzo-annuncio').value),
                urlImmagine: document.getElementById('immagine-annuncio').value,
                descrizione: document.getElementById('descrizione-annuncio').value
            };

            const res = await fetch('/api/annunci', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('Annuncio pubblicato con successo!');
                document.getElementById('form-annuncio').reset();
                caricaAnnunciAttivi();
            } else {
                const data = await res.json();
                alert('Errore: ' + data.error);
            }
        }

        async function eliminaAnnuncio(id) {
            if (!confirm('Rimuovere questo annuncio?')) return;
            const res = await fetch(`/api/prodotti/annuncio/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) caricaAnnunciAttivi();
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        socket.on('inventario_aggiornato', () => {
            caricaProdottiPerSelect();
            caricaAnnunciAttivi();
        });

        // Inizializzazione
        caricaProdottiPerSelect();
        caricaAnnunciAttivi();
    </script>
</body>
</html>
