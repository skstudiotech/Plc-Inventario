<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Componenti PC & Schede Madri - SK GROUP SYSTEM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* Stile fedele alla Home Page dello screenshot */
    body {
      background-color: #0b1021; /* Sfondo scuro navy */
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .navbar-custom {
      background-color: #070a14;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .card-prodotto {
      background: #12182d;
      border: 1px solid #1e2942;
      border-radius: 12px;
      transition: transform 0.2s;
    }
    .card-prodotto:hover {
      transform: translateY(-5px);
      border-color: #2563eb;
    }
    .btn-blue {
      background-color: #2563eb;
      color: #fff;
      border: none;
      font-weight: 600;
    }
    .btn-blue:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <!-- Navbar originale SK GROUP SYSTEM -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
    <a class="navbar-brand fw-bold text-primary" href="index.html">
      <span class="badge bg-primary me-2">SK</span> SK GROUP SYSTEM
    </a>
    <div class="collapse navbar-collapse justify-content-end">
      <ul class="navbar-nav gap-3">
        <li class="nav-item"><a class="nav-link text-light" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link text-light" href="componenti-pc.html">Componenti PC</a></li>
        <li class="nav-item"><a class="nav-link text-light" href="assemblaggio-custom-pc.html">Custom PC</a></li>
        <li class="nav-item"><a class="nav-link text-light" href="sistemi-plc.html">Sistemi PLC</a></li>
      </ul>
    </div>
  </nav>

  <!-- Banner Categoria -->
  <div class="container text-center my-5 py-4">
    <span class="badge bg-dark border border-primary text-primary px-3 py-2 mb-3">CATALOGO DEDICATO</span>
    <h1 class="fw-bold">Componenti PC & Schede Madri</h1>
    <p class="text-secondary">Esplora i nostri componenti selezionati per alte prestazioni.</p>
  </div>

  <!-- Container Prodotti Dinamici -->
  <div class="container my-5">
    <div class="row g-4" id="grigliaProdotti">
      <!-- Gli annunci caricati dal database per QUESTA categoria appaiono qui -->
    </div>
  </div>

  <script>
    // Fetch per caricare solo gli annunci della categoria corrente
    fetch('/api/annunci?categoria=componenti-pc')
      .then(res => res.json())
      .then(annunci => {
        const container = document.getElementById('grigliaProdotti');
        container.innerHTML = annunci.map(item => `
          <div class="col-md-4">
            <div class="card card-prodotto p-3 text-light">
              <img src="${item.immagine || 'placeholder.jpg'}" class="card-img-top rounded mb-3" style="height: 200px; object-fit: cover;">
              <h5 class="fw-bold">${item.titolo}</h5>
              <p class="text-secondary small">${item.descrizione}</p>
              <div class="d-flex justify-content-between align-items-center mt-3">
                <span class="fs-5 fw-bold text-primary">€${parseFloat(item.prezzo).toFixed(2)}</span>
                <button class="btn btn-blue px-3">Dettagli</button>
              </div>
            </div>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
